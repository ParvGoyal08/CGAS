      - op: CREATE
        outputs: [{id: bread, concept: bread, label: bread}]
      - {op: MERGE, inputs: [custard, bread], process: pour, span: Pour the mixture over the bread, outputs: [{id: soaked, label: soaking bread}]}
      - {op: TRANSFORM, input: soaked, process: soak}
