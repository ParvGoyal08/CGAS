annotator: CLAUDE-EXAMPLE
guideline_version: v1
source_text: Add some of the stock and stir.
# UNKNOWN is correct: 'some of the stock' — a split whose share is unstated: no fraction, no quantity
steps:
  - step: 1
    text: Add some of the stock and stir.
    events:
      - op: CREATE
        outputs:
          - {id: stock, concept: stock, label: stock}
          - {id: base, label: base}
      - op: SPLIT
        input: stock
        process: add
        outputs:
          - {id: stock_used, label: stock added}
          - {id: stock_left, label: stock left over}
      - {op: MERGE, inputs: [base, stock_used], process: stir, outputs: [{id: pot, label: base with stock}]}
